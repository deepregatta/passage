[project]
name = "deepweather-analysis"
version = "0.1.0"
description = "deepweather shared data-prep factory: GRIB ingestion, synoptic detection, CMEMS currents, warnings, tides, verification"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "xarray>=2024.0,<2027.0",
    "matplotlib>=3.8,<4.0",
    "requests>=2.31,<3.0",
    "orjson>=3.9,<4.0",
    "global-land-mask>=1.0,<2.0",
]

[project.optional-dependencies]
environment = [
    "netcdf4>=1.6,<2.0",
    "cfgrib>=0.9.14,<1.0",
    "eccodes>=2.37",
    "eccodeslib>=2.45; platform_machine == 'x86_64' or platform_machine == 'aarch64'",
    "ecmwf-opendata>=0.3,<1.0",
    "cdsapi>=0.6,<1.0",
    "copernicusmarine>=2.0,<3.0",
]

[project.scripts]
deepweather-analysis = "deepweather_analysis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepweather_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
