# Deployed by hand (see docs/boat-polars.md for the exact command).
# The Pages project binds it as POLAR_LIMITER (service binding, production).
name = "passage-polar-limiter"
main = "index.mjs"
compatibility_date = "2026-07-12"
workers_dev = false
preview_urls = false

# One Durable Object per kind and client: 30 boat reads and 10 boat-list
# reads per 60 s sliding window (decision 11; limits in index.mjs).
[[durable_objects.bindings]]
name = "CLIENT_WINDOWS"
class_name = "ClientWindow"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClientWindow"]
