name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shared-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate GitHub Actions workflows
        run: bash scripts/check-workflows.sh
      - run: python3 scripts/check_shared_contracts.py
      - run: python3 scripts/check_storage_admission.py
      - run: python3 -m unittest discover -s scripts -p test_shared_contracts.py

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - name: Build, type-check engine tests, and run unit suites
        run: npm test
      - run: npm run build:pages

  browser:
    # Keep the screenshot renderer's OS stable across ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w viewer -- --workers=1
      - run: npm run build:pages
      - name: Verify built GRIB entry points and attribution
        run: npm run test:e2e:build -w viewer -- --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-failures
          path: output/playwright-results/
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - run: uv run ruff check . ../scripts/upload-prepared-run.py ../scripts/prepared_storage.py ../scripts/storage_admission.py ../scripts/preview_prepared_retention.py ../scripts/check_storage_admission.py
      - run: uv run ruff format --check . ../scripts/upload-prepared-run.py ../scripts/prepared_storage.py ../scripts/storage_admission.py ../scripts/preview_prepared_retention.py ../scripts/check_storage_admission.py
