name: prepare-synoptic

# Publishes the route-independent prepared run (synoptic features + chart
# panels + wind grid, plus the CMEMS current grid when credentials are set)
# to R2 under prepared/, where the production viewer reads it from the
# forecast tile host (viewer/src/lib/preparedRun.js).
#
# Requires repo secrets (same values as deepregatta/forecast-tiles):
#   R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
# and optionally COPERNICUSMARINE_SERVICE_USERNAME / _PASSWORD for currents.

on:
  schedule:
    - cron: "25 5,11,17,23 * * *" # after ECMWF open-data publication, like the tiles repo
  workflow_dispatch:
    inputs:
      cycle:
        description: "ECMWF cycle YYYYMMDDTHHZ (default: latest published)"
        required: false

concurrency:
  group: prepare-synoptic
  cancel-in-progress: false

permissions:
  contents: read

# Enable only after the reviewed R2 control document has been provisioned.
env:
  PAID_WORK_ENFORCE: ${{ vars.PAID_WORK_ENFORCE || '0' }}
  # F01/P01 staged rollout: leave off until the shared policy and all writers are reviewed.
  CAPACITY_ENFORCE: ${{ vars.CAPACITY_ENFORCE || '0' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # secrets are not readable inside `if:` expressions; surface presence via env
      CMEMS_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Sync analysis environment
        working-directory: analysis
        run: uv sync --all-extras # GRIB/ECMWF/CMEMS deps live in the "environment" extra; jsonschema is a runtime dependency

      - name: Prepare synoptic run (ECMWF features + charts + wind grid)
        working-directory: analysis
        run: uv run --no-sync deepweather-analysis prepare-run ${CYCLE:+--cycle "$CYCLE"}
        env:
          CYCLE: ${{ inputs.cycle }}

      - name: Prepare current grid (CMEMS)
        if: ${{ env.CMEMS_USERNAME != '' }}
        working-directory: analysis
        continue-on-error: true # a currents outage never blocks the synoptic publish
        run: uv run --no-sync deepweather-analysis fetch-currents
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      - name: Upload prepared run to R2
        run: |
          pip install --quiet boto3
          python scripts/upload-prepared-run.py
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
